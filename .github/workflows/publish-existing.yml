name: publish-existing

# Recovery path: publish artifacts from an earlier successful release run
# without rebuilding. Useful when only the final publish job failed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.2.3)
        required: true
        type: string
      run_id:
        description: Workflow run that contains windows and linux-* artifacts
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd dist
          sha256sum * | sed 's#  .*/#  #' > "SHA256SUMS-${TAG}.txt"
          cat "SHA256SUMS-${TAG}.txt"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
