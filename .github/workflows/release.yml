name: release

# Builds the Windows installer and the Linux packages (AppImage / deb / rpm) for
# a version tag, then attaches them to that GitHub release.
#
# Windows could be built locally with packaging/build_desktop.ps1; Linux cannot —
# PyInstaller has to run on Linux and electron-builder only builds Linux targets
# on a Linux host. This workflow is the supported way to get both from one tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend dependencies
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -e backend -r packaging/requirements-packaging.txt

      - name: Backend bundle (PyInstaller + selftest + smoke)
        shell: pwsh
        run: ./packaging/build_backend.ps1 -SkipInstall

      - name: Installer (frontend + Electron + NSIS)
        shell: pwsh
        run: ./packaging/build_desktop.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Backend bundle + packages
        run: |
          chmod +x packaging/build_linux.sh
          ./packaging/build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/release-linux/*.AppImage
            desktop/release-linux/*.deb
            desktop/release-linux/*.rpm
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * | sed 's#  .*/#  #' > "SHA256SUMS-${GITHUB_REF_NAME}.txt"
          cat "SHA256SUMS-${GITHUB_REF_NAME}.txt"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
