name: release

# Builds the Windows installer and the Linux packages (AppImage / deb / rpm) for
# a version tag, then attaches them to that GitHub release.
#
# Linux runs on native x64 and arm64 runners. The backend is bundled with
# uv-managed CPython, which is linked against an old glibc, so the AppImage does
# not inherit the runner's newer glibc (the previous GLIBC_2.38 failure).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend dependencies
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -e backend -r packaging/requirements-packaging.txt

      - name: Backend bundle (PyInstaller + selftest + smoke)
        shell: pwsh
        run: ./packaging/build_backend.ps1 -SkipInstall

      - name: Installer (frontend + Electron + NSIS)
        shell: pwsh
        run: ./packaging/build_desktop.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # uv's CPython is built against glibc 2.17, and objdump is used for the
      # post-build compatibility audit.
      - uses: astral-sh/setup-uv@v5

      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm binutils

      # electron-builder bundles an x86_64 fpm. On an arm64 runner that binary
      # fails with "Exec format error", so build with the distro's native fpm.
      - name: Native fpm (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Backend bundle + packages (${{ matrix.arch }})
        env:
          USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' && 'true' || 'false' }}
        run: |
          chmod +x packaging/build_linux.sh
          ./packaging/build_linux.sh --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            desktop/release-linux/*.AppImage
            desktop/release-linux/*.deb
            desktop/release-linux/*.rpm
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes needs a git checkout (and the full
      # history) to build the notes; this job previously failed with
      # "fatal: not a git repository".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * | sed 's#  .*/#  #' > "SHA256SUMS-${GITHUB_REF_NAME}.txt"
          cat "SHA256SUMS-${GITHUB_REF_NAME}.txt"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "CodeSlice $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
