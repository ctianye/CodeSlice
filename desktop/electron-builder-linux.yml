appId: com.codeslice.app
productName: CodeSlice
copyright: Copyright © 2026 CodeSlice

directories:
  # Keep Linux artifacts separate from the Windows release directory; this also
  # avoids a Windows file lock on an interrupted linux-unpacked build.
  output: release-linux
  buildResources: build-assets

# Renderer bundle + compiled Electron main/preload + manifest.
files:
  - dist/**
  - electron/**
  - package.json
  - '!electron/*.ts'
  - '!electron/tsconfig.json'
  - '!**/*.map'

# Linux uses the platform-specific PyInstaller bundle produced in WSL.
# The backend is a flat directory: codeslice-backend + _internal/.
extraResources:
  - from: build-assets/icon.png
    to: icon.png
  - from: ../packaging/dist-backend-linux
    to: backend
    filter:
      - '**/*'
  # The backend serves this same renderer over http://127.0.0.1.
  - from: dist
    to: frontend
    filter:
      - '**/*'

linux:
  # The architecture is selected on the command line by packaging/build_linux.sh
  # (--x64 or --arm64). Keeping it out of the target list lets one config serve
  # both the native x64 and the native arm64 CI runners.
  target:
    - AppImage
    - deb
    - rpm
  icon: build-assets/icon.png
  executableName: codeslice
  category: Development
  maintainer: CodeSlice
  synopsis: Local-first code reading assistant
  description: Read code, ask grounded questions, and build a local knowledge graph.
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    Name: CodeSlice
    Comment: Local-first AI code reading assistant
    Categories: Development;Utility;
    Keywords: code;AI;graph;search;development;
