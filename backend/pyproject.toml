[project]
name = "code-learning-agent-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "watchfiles>=1.3",
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "aiosqlite>=0.20",
  "tree-sitter>=0.23",
  "numpy>=1.26",
  "networkx>=3.4",
  "httpx>=0.27",
  "keyring>=25.7.0",
  "langchain-openai>=1.7.4",
  "langchain-core>=1.7.6",
  "langchain-anthropic>=1.7.10",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "tree-sitter-go>=0.25.0",
  "tree-sitter-rust>=0.24.2",
  "tree-sitter-java>=0.23.5",
  "tree-sitter-c>=0.24.2",
  "tree-sitter-cpp>=0.23.4",
  "tree-sitter-json>=0.24.8",
  "tree-sitter-bash>=0.25.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv"]

# The app is deliberately defensive: optional subsystems (git, keyring, vector
# store) must never take the whole request down, so broad excepts are expected.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# conftest must set env vars before importing the app package.
"tests/conftest.py" = ["E402"]
# scripts/ holds local diagnostic helpers (HTTP smoke tests, CDP screenshots,
# a fake model server). They embed long JS/JSON snippets and use broad guards on
# purpose, and they are never imported by the app.
"scripts/*.py" = ["E501", "SIM105", "SIM110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
